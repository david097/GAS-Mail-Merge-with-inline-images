<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body { padding-bottom: 40px; }
    .block { margin-bottom: 12px; }
    label.title { color: #5f6368; display: block; margin-bottom: 3px; }
    select, input[type=text] { width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row select { flex: 1; }
    .link { font-size: 12px; cursor: pointer; color: #1a73e8; text-decoration: none; white-space: nowrap; }
    .hint { color: #80868b; font-size: 11px; margin-top: 2px; }
    #status { margin-top: 10px; white-space: pre-line; }
    #status.err { color: #d93025; }
    #status.warn { color: #e37400; }
    #status.ok { color: #188038; }
    .hidden { display: none; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 12px; background: #fff; border-top: 1px solid #eee; color: #80868b; font-size: 11px; }
  </style>
</head>
<body>
<div class="sidebar">
  <form id="form" onsubmit="return false">

    <div class="block">
      <label class="title" for="draft">메일 템플릿 (Gmail 임시보관함)</label>
      <div class="row">
        <select id="draft"><option>불러오는 중...</option></select>
        <a class="link" id="reloadDrafts" title="초안 목록 새로고침">새로고침</a>
      </div>
      <div class="hint" id="draftHint">제목/본문에 {{Name}}, {{이름}} 처럼 시트 머리행 이름을 넣으세요.</div>
    </div>

    <div class="block">
      <label class="title" for="sheet">받는 사람 시트</label>
      <select id="sheet"></select>
    </div>

    <div class="block">
      <label class="title" for="senderEmail">보내는 주소</label>
      <select id="senderEmail"></select>
    </div>

    <div class="block">
      <label class="title" for="senderName">보내는 사람 이름</label>
      <input type="text" id="senderName">
    </div>

    <div class="block">
      <label class="title" for="cc">CC (선택)</label>
      <input type="text" id="cc" placeholder="쉼표로 구분">
    </div>

    <div class="block">
      <label class="title" for="bcc">BCC (선택)</label>
      <input type="text" id="bcc" placeholder="쉼표로 구분">
    </div>

    <div class="block">
      <label><input type="checkbox" id="useSlide"> 슬라이드 이미지 넣기 <code>{{SlideImage}}</code></label>
      <div id="slideBox" class="hidden" style="margin-top:4px">
        <div class="row">
          <select id="slide"></select>
          <a class="link" id="openSlide">열기</a>
          <a class="link" id="newSlide">새로 만들기</a>
        </div>
        <div class="hint">첫 번째 장이 템플릿입니다. 장 안의 {{Name}} 등이 치환되어 이미지로 들어갑니다.</div>
      </div>
    </div>

    <div class="block">
      <fieldset>
        <legend><b>무엇을 할까요?</b></legend>
        <div><input type="radio" id="modeTest" name="mode" value="test"> <label for="modeTest">테스트 메일 보내기 (나에게 1통)</label></div>
        <div><input type="radio" id="modeRun" name="mode" value="run" checked> <label for="modeRun">메일머지 실행</label></div>
      </fieldset>
    </div>

    <div class="block">
      <button type="button" id="runBtn" class="action">RUN</button>
      <button type="button" id="resetBtn">새로고침</button>
      <div id="status"></div>
    </div>
  </form>
</div>

<div class="footer">Mail Merge with inline images © David Sung</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var senders = [];
  var confirmPending = false; // RUN 두 번 눌러야 실제 발송

  function setStatus(text, cls) {
    $('status').textContent = text || '';
    $('status').className = cls || '';
  }

  function fillSelect(sel, items, getValue, getLabel, selected) {
    sel.innerHTML = '';
    items.forEach(function (item) {
      var opt = document.createElement('option');
      opt.value = getValue(item);
      opt.textContent = getLabel(item);
      if (selected !== undefined && opt.value === selected) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function call(fnName, args, onOk) {
    var runner = google.script.run
      .withSuccessHandler(onOk)
      .withFailureHandler(function (err) {
        setStatus(err.message || String(err), 'err');
        resetRunButton();
      });
    runner[fnName].apply(runner, args || []);
  }

  function renderDrafts(drafts) {
    if (!drafts.length) {
      fillSelect($('draft'), [{ id: '', label: '(임시보관함에 초안이 없습니다)' }], function (d) { return d.id; }, function (d) { return d.label; });
      $('draftHint').innerHTML = 'Gmail에서 보낼 메일을 작성해 임시보관함에 저장한 뒤 <b>새로고침</b>을 누르세요. ' +
        '<a class="link" href="https://mail.google.com/mail/u/0/#inbox?compose=new" target="_blank">Gmail 새 메일 쓰기</a>';
      return;
    }
    fillSelect($('draft'), drafts, function (d) { return d.id; }, function (d) { return d.label; });
  }

  function load() {
    setStatus('불러오는 중...');
    resetRunButton();
    call('getSidebarData', [], function (data) {
      renderDrafts(data.drafts);
      fillSelect($('sheet'), data.sheets, function (s) { return s; }, function (s) { return s; }, data.activeSheet);
      senders = data.senders;
      fillSelect($('senderEmail'), senders, function (s) { return s.email; }, function (s) { return s.email; });
      $('senderName').value = data.senderName || '';
      setStatus('');
    });
  }

  function loadSlides() {
    $('slide').innerHTML = '<option>불러오는 중...</option>';
    call('getSlides', [], function (slides) {
      if (!slides.length) {
        $('slide').innerHTML = '<option value="">(슬라이드 없음 — 새로 만들기)</option>';
        return;
      }
      fillSelect($('slide'), slides, function (s) { return s.url; }, function (s) { return s.name; });
    });
  }

  function resetRunButton() {
    confirmPending = false;
    $('runBtn').disabled = false;
    $('runBtn').textContent = mode() === 'test' ? 'TEST' : 'RUN';
  }

  function mode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }

  function collect() {
    return {
      draftId: $('draft').value,
      sheetName: $('sheet').value,
      senderEmail: $('senderEmail').value,
      senderName: $('senderName').value.trim(),
      cc: $('cc').value.trim(),
      bcc: $('bcc').value.trim(),
      mode: mode(),
      slideUrl: $('useSlide').checked ? $('slide').value : ''
    };
  }

  function send(opts) {
    $('runBtn').disabled = true;
    setStatus(opts.mode === 'test' ? '테스트 메일 보내는 중...' : '발송 중... 창을 닫지 마세요.');
    call('startMailMerge', [opts], function (r) {
      var msg = '성공 ' + r.sent + ' · 건너뜀 ' + r.skipped + ' · 실패 ' + r.failed;
      if (r.stoppedEarly) msg += '\n시간 제한으로 멈췄습니다. 남은 ' + r.remaining + '건은 RUN을 다시 누르면 이어서 보냅니다.';
      if (r.missingFields && r.missingFields.length) msg += '\n시트에 없는 필드: ' + r.missingFields.join(', ');
      setStatus(msg, r.failed || r.stoppedEarly || (r.missingFields && r.missingFields.length) ? 'warn' : 'ok');
      resetRunButton();
    });
  }

  $('runBtn').addEventListener('click', function () {
    var opts = collect();
    if (!opts.draftId) return setStatus('메일 템플릿(초안)을 선택해 주세요.', 'err');
    if (opts.mode === 'test') return send(opts);

    if (confirmPending) return send(opts);

    // 실제 발송 전 한 번 확인
    $('runBtn').disabled = true;
    call('getSendPreview', [opts.sheetName], function (p) {
      $('runBtn').disabled = false;
      if (!p.pending) {
        setStatus('보낼 대상이 없습니다. (이미 발송 ' + p.sent + '건, 주소 오류 ' + p.invalid + '건)\n다시 보내려면 Mail Merge Status 칸의 EMAIL_SENT 를 지우세요.', 'warn');
        return;
      }
      confirmPending = true;
      $('runBtn').textContent = p.pending + '명에게 발송';
      setStatus('발송 대상 ' + p.pending + '명 (이미 발송 ' + p.sent + ', 주소 오류 ' + p.invalid + ')\n버튼을 한 번 더 누르면 발송을 시작합니다.', 'warn');
    });
  });

  // 입력값이 바뀌면 확인 상태 해제
  ['draft', 'sheet', 'senderEmail', 'modeTest', 'modeRun'].forEach(function (id) {
    $(id).addEventListener('change', function () { resetRunButton(); setStatus(''); });
  });

  $('senderEmail').addEventListener('change', function () {
    var s = senders.filter(function (x) { return x.email === $('senderEmail').value; })[0];
    if (s && s.name) $('senderName').value = s.name;
  });

  $('reloadDrafts').addEventListener('click', function () {
    call('getDrafts', [], renderDrafts);
  });

  $('resetBtn').addEventListener('click', load);

  $('useSlide').addEventListener('change', function () {
    $('slideBox').className = this.checked ? '' : 'hidden';
    if (this.checked) loadSlides();
  });

  $('openSlide').addEventListener('click', function () {
    if ($('slide').value) window.open($('slide').value, '_blank');
  });

  $('newSlide').addEventListener('click', function () {
    setStatus('슬라이드 만드는 중...');
    call('createSlide', [], function (s) {
      // 비동기 후 window.open 은 팝업 차단에 걸리므로 목록에 추가하고 '열기'로 안내
      $('slide').innerHTML = '';
      fillSelect($('slide'), [s], function (x) { return x.url; }, function (x) { return x.name; });
      setStatus("새 슬라이드를 만들었습니다. '열기'를 눌러 첫 장에 {{Name}} 등을 넣어 꾸미세요.", 'ok');
    });
  });

  load();
</script>
</body>
</html>
