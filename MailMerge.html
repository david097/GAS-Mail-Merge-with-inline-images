<!DOCTYPE html>
<html lang="<?= lang ?>">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body { padding-bottom: 40px; }
    .block { margin-bottom: 12px; }
    label.title { color: #5f6368; display: block; margin-bottom: 3px; }
    select, input[type=text] { width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row select { flex: 1; }
    .link { font-size: 12px; cursor: pointer; color: #1a73e8; text-decoration: none; white-space: nowrap; }
    .hint { color: #80868b; font-size: 11px; margin-top: 2px; }
    #status { margin-top: 10px; white-space: pre-line; }
    #status.err { color: #d93025; }
    #status.warn { color: #e37400; }
    #status.ok { color: #188038; }
    .hidden { display: none; }
    .lang { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-bottom: 8px; font-size: 12px; color: #5f6368; }
    .lang select { width: auto; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 12px; background: #fff; border-top: 1px solid #eee; color: #80868b; font-size: 11px; }
  </style>
</head>
<body>
<div class="sidebar">

  <div class="lang">
    <span>🌐</span>
    <select id="language" title="<?= s.language_hint ?>">
      <? languages.forEach(function (l) { ?>
        <option value="<?= l.code ?>"<? if (l.code === lang) { ?> selected<? } ?>><?= l.name ?></option>
      <? }); ?>
    </select>
  </div>

  <form id="form" onsubmit="return false" autocomplete="off">

    <div class="block">
      <label class="title" for="draft"><?= s.draft_label ?></label>
      <div class="row">
        <select id="draft"><option><?= s.loading ?></option></select>
        <a class="link" id="reloadDrafts"><?= s.reload ?></a>
      </div>
      <div class="hint" id="draftHint"><?= s.draft_hint ?></div>
    </div>

    <div class="block">
      <label class="title" for="sheet"><?= s.sheet_label ?></label>
      <select id="sheet"></select>
    </div>

    <div class="block">
      <label class="title" for="senderEmail"><?= s.from_label ?></label>
      <select id="senderEmail"></select>
    </div>

    <div class="block">
      <label class="title" for="senderName"><?= s.name_label ?></label>
      <input type="text" id="senderName">
    </div>

    <div class="block">
      <label class="title" for="cc"><?= s.cc_label ?></label>
      <input type="text" id="cc" placeholder="<?= s.comma_separated ?>">
    </div>

    <div class="block">
      <label class="title" for="bcc"><?= s.bcc_label ?></label>
      <input type="text" id="bcc" placeholder="<?= s.comma_separated ?>">
    </div>

    <div class="block">
      <label><input type="checkbox" id="useSlide"> <?= s.slide_check ?> <code>{{SlideImage}}</code></label>
      <div id="slideBox" class="hidden" style="margin-top:4px">
        <div class="row">
          <select id="slide"></select>
          <a class="link" id="openSlide"><?= s.slide_open ?></a>
          <a class="link" id="newSlide"><?= s.slide_new ?></a>
        </div>
        <div class="hint"><?= s.slide_hint ?></div>
      </div>
    </div>

    <div class="block">
      <fieldset>
        <legend><b><?= s.mode_legend ?></b></legend>
        <div><input type="radio" id="modeTest" name="mode" value="test"> <label for="modeTest"><?= s.mode_test ?></label></div>
        <div><input type="radio" id="modeRun" name="mode" value="run" checked> <label for="modeRun"><?= s.mode_run ?></label></div>
      </fieldset>
    </div>

    <div class="block">
      <button type="button" id="runBtn" class="action"><?= s.btn_run ?></button>
      <button type="button" id="resetBtn"><?= s.btn_reset ?></button>
      <div id="status"></div>
    </div>
  </form>
</div>

<div class="footer">Mail Merge with inline images © David Sung · <a href="https://github.com/david097/GAS-Mail-Merge-with-inline-images" target="_blank">GitHub</a></div>

<script>
  // UI strings for the current language (from Lang_*.gs)
  var S = <?!= JSON.stringify(s).replace(/</g, '\\u003c') ?>;

  var $ = function (id) { return document.getElementById(id); };
  var senders = [];
  var confirmPending = false; // RUN must be clicked twice to actually send

  /** Same placeholder format as t() on the server: tr('key', {n: 3}) */
  function tr(key, params) {
    var text = S[key] !== undefined ? S[key] : key;
    return text.replace(/\{(\w+)\}/g, function (m, k) {
      return params && Object.prototype.hasOwnProperty.call(params, k) ? String(params[k]) : m;
    });
  }

  function setStatus(text, cls) {
    $('status').textContent = text || '';
    $('status').className = cls || '';
  }

  function fillSelect(sel, items, getValue, getLabel, selected) {
    sel.innerHTML = '';
    items.forEach(function (item) {
      var opt = document.createElement('option');
      opt.value = getValue(item);
      opt.textContent = getLabel(item);
      if (selected !== undefined && opt.value === selected) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function call(fnName, args, onOk) {
    var runner = google.script.run
      .withSuccessHandler(onOk)
      .withFailureHandler(function (err) {
        setStatus(err.message || String(err), 'err');
        resetRunButton();
      });
    runner[fnName].apply(runner, args || []);
  }

  function renderDrafts(drafts) {
    if (!drafts.length) {
      fillSelect($('draft'), [{ id: '', label: S.no_drafts }], function (d) { return d.id; }, function (d) { return d.label; });
      var hint = $('draftHint');
      hint.textContent = S.no_drafts_hint + ' ';
      var a = document.createElement('a');
      a.className = 'link';
      a.href = 'https://mail.google.com/mail/u/0/#inbox?compose=new';
      a.target = '_blank';
      a.textContent = S.gmail_compose;
      hint.appendChild(a);
      return;
    }
    $('draftHint').textContent = S.draft_hint;
    fillSelect($('draft'), drafts, function (d) { return d.id; }, function (d) { return d.label; });
  }

  function load() {
    setStatus(S.loading);
    resetRunButton();
    call('getSidebarData', [], function (data) {
      renderDrafts(data.drafts);
      fillSelect($('sheet'), data.sheets, function (s) { return s; }, function (s) { return s; }, data.activeSheet);
      senders = data.senders;
      fillSelect($('senderEmail'), senders, function (s) { return s.email; }, function (s) { return s.email; });
      $('senderName').value = data.senderName || '';
      setStatus('');
    });
  }

  function loadSlides() {
    fillSelect($('slide'), [S.loading], function () { return ''; }, function (x) { return x; });
    call('getSlides', [], function (slides) {
      if (!slides.length) {
        fillSelect($('slide'), [S.slide_none], function () { return ''; }, function (x) { return x; });
        return;
      }
      fillSelect($('slide'), slides, function (s) { return s.url; }, function (s) { return s.name; });
    });
  }

  function mode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }

  function resetRunButton() {
    confirmPending = false;
    $('runBtn').disabled = false;
    $('runBtn').textContent = mode() === 'test' ? S.btn_test : S.btn_run;
  }

  function collect() {
    return {
      draftId: $('draft').value,
      sheetName: $('sheet').value,
      senderEmail: $('senderEmail').value,
      senderName: $('senderName').value.trim(),
      cc: $('cc').value.trim(),
      bcc: $('bcc').value.trim(),
      mode: mode(),
      slideUrl: $('useSlide').checked ? $('slide').value : ''
    };
  }

  function send(opts) {
    $('runBtn').disabled = true;
    setStatus(opts.mode === 'test' ? S.sending_test : S.sending_run);
    call('startMailMerge', [opts], function (r) {
      var msg = tr('result_summary', { sent: r.sent, skipped: r.skipped, failed: r.failed });
      if (r.stoppedEarly) msg += '\n' + tr('result_stopped', { n: r.remaining });
      var hasMissing = r.missingFields && r.missingFields.length;
      if (hasMissing) {
        msg += '\n' + tr('result_missing', { fields: r.missingFields.map(function (f) { return '{{' + f + '}}'; }).join(', ') });
      }
      setStatus(msg, r.failed || r.stoppedEarly || hasMissing ? 'warn' : 'ok');
      resetRunButton();
    });
  }

  $('runBtn').addEventListener('click', function () {
    var opts = collect();
    if (!opts.draftId) return setStatus(S.err_no_draft_selected, 'err');
    if (opts.mode === 'test') return send(opts);
    if (confirmPending) return send(opts);

    // Show how many people will receive the email, then require a second click.
    $('runBtn').disabled = true;
    call('getSendPreview', [opts.sheetName], function (p) {
      $('runBtn').disabled = false;
      if (!p.pending) {
        setStatus(tr('nothing_to_send', { sent: p.sent, invalid: p.invalid }), 'warn');
        return;
      }
      confirmPending = true;
      $('runBtn').textContent = tr('btn_confirm', { n: p.pending });
      setStatus(tr('confirm_text', { n: p.pending, sent: p.sent, invalid: p.invalid }), 'warn');
    });
  });

  // Any change cancels a pending confirmation.
  ['draft', 'sheet', 'senderEmail', 'modeTest', 'modeRun'].forEach(function (id) {
    $(id).addEventListener('change', function () { resetRunButton(); setStatus(''); });
  });

  $('senderEmail').addEventListener('change', function () {
    var s = senders.filter(function (x) { return x.email === $('senderEmail').value; })[0];
    if (s && s.name) $('senderName').value = s.name;
  });

  $('reloadDrafts').addEventListener('click', function () {
    call('getDrafts', [], renderDrafts);
  });

  $('resetBtn').addEventListener('click', load);

  $('useSlide').addEventListener('change', function () {
    $('slideBox').className = this.checked ? '' : 'hidden';
    if (this.checked) loadSlides();
  });

  $('openSlide').addEventListener('click', function () {
    if ($('slide').value) window.open($('slide').value, '_blank');
  });

  $('newSlide').addEventListener('click', function () {
    setStatus(S.slide_creating);
    call('createSlide', [], function (s) {
      // window.open after an async call is blocked as a pop-up, so add it to the list instead.
      fillSelect($('slide'), [s], function (x) { return x.url; }, function (x) { return x.name; });
      setStatus(S.slide_created, 'ok');
    });
  });

  $('language').addEventListener('change', function () {
    setStatus(S.loading);
    // The server saves the choice and reopens the sidebar in the new language.
    call('changeLanguage', [this.value], function () {});
  });

  // Browsers may restore a checked state on reload while the box stays hidden; always start unchecked.
  $('useSlide').checked = false;
  $('slideBox').className = 'hidden';

  load();
</script>
</body>
</html>
